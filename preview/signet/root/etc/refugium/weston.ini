[core]
shell=desktop-shell.so
idle-time=0
xwayland=true

[shell]
panel-position=bottom
locking=false
background-image=/usr/share/backgrounds/refugium-offline.png
background-type=scale-crop

[autolaunch]
path=/usr/bin/mr-gui
watch=false

[launcher]
icon=/usr/share/refugium/icons/terminal.png
path=/usr/bin/weston-terminal

[launcher]
icon=/usr/share/refugium/icons/wallet.png
path=/usr/bin/mr-gui

[launcher]
icon=/usr/local/share/personal-keys/keys.png
path=/usr/local/bin/personal-key-viewer

[xwayland]
path=/usr/local/bin/xwayland-clipboard
